<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fiona Callanan · Coming soon</title>
  <meta name="description" content="Fiona Callanan: yoga and handstand teacher, author and speaker. New website coming soon. Follow along on Instagram.">
  <meta name="theme-color" content="#ffffff">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Fiona Callanan">
  <meta property="og:description" content="Yoga and handstand teacher, author and speaker. New website coming soon.">
  <meta property="og:image" content="https://sandcastleco.github.io/fiona-callanan/images/fiona-callanan-handstand-1600.jpg">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="2400">
  <meta property="og:image:alt" content="Fiona Callanan in a headstand in front of a colourful mural">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="images/fiona-callanan-handstand-1600.jpg" imagesrcset="images/fiona-callanan-handstand-1000.jpg 1000w, images/fiona-callanan-handstand-1600.jpg 1600w, images/fiona-callanan-handstand-2400.jpg 2400w" imagesizes="(min-aspect-ratio: 4/5) 100vh, 150vw">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0f2f33;
      --accent: #146b6b;
      --paper: #ffffff;
      /* Photo is 2:3. Subject spans ~21-77% of width and ~22-82% of height.
         Scale to cover the viewport, but never so far that the subject is cropped. */
      --img-w: min(max(100cqw, 66.625cqh), 111cqh, 178cqw);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100svh;
    }
    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      container-type: size;
    }
    .stage img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--img-w);
      height: auto;
      transform: translate(-50%, -51.5%);
      display: block;
      user-select: none;
    }
    .name {
      position: absolute;
      top: max(4svh, env(safe-area-inset-top));
      z-index: 1;
      left: 0; right: 0;
      margin: 0;
      text-align: center;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.25rem, 7vw, 4.75rem);
      line-height: 1;
      letter-spacing: -0.01em;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 28px rgba(0,0,0,.35);
    }
    .footer {
      position: absolute;
      left: 0; right: 0;
      bottom: max(4svh, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      text-align: center;
    }
    .soon {
      margin: 0;
      font-size: clamp(.95rem, 2.2vw, 1.15rem);
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: lowercase;
      color: var(--ink);
      background: rgba(255,255,255,.85);
      padding: .3em .8em;
      border-radius: 999px;
    }
    .ig {
      display: inline-flex;
      align-items: center;
      gap: .55em;
      padding: .8em 1.3em;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: clamp(.95rem, 2.2vw, 1.05rem);
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(15,47,51,.25);
      transition: background .2s, transform .2s;
    }
    .ig:hover { background: var(--ink); transform: translateY(-1px); }
    .ig:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .ig svg { width: 1.2em; height: 1.2em; }

    /* Landscape and near-square: her hands and face sit near the bottom of the crop, so move the
       call to action out of the photo into a white strip beneath it. */
    @media (min-aspect-ratio: 4/5) {
      .footer {
        position: static;
        flex-direction: row;
        justify-content: center;
        gap: 1.25rem;
        padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
      }
      .soon { background: none; padding: 0; }
      .name {
        position: static;
        color: var(--ink);
        text-shadow: none;
        font-size: clamp(2rem, 5.5vh, 3.5rem);
        padding: max(1rem, 2.5vh) 1rem max(.75rem, 2vh);
      }
      .stage img { transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="name">Fiona Callanan</h1>
    <div class="stage">
    <img src="images/fiona-callanan-handstand-1600.jpg" width="1600" height="2400"
         srcset="images/fiona-callanan-handstand-1000.jpg 1000w, images/fiona-callanan-handstand-1600.jpg 1600w, images/fiona-callanan-handstand-2400.jpg 2400w"
         sizes="(min-aspect-ratio: 4/5) 100vh, 150vw"
         alt="Fiona Callanan in a forearm headstand on a yoga mat, legs folded and prosthetic leg raised, in front of a colourful mural"
         fetchpriority="high">
    </div>
    <div class="footer">
      <p class="soon">(coming soon!)</p>
      <a class="ig" href="https://www.instagram.com/bionic_rocket_woman/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Follow me on Instagram
      </a>
    </div>
  </main>
</body>
</html>
