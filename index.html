<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fiona Callanan · Coming soon</title>
  <meta name="description" content="Fiona Callanan: yoga and handstand teacher, author and speaker. New website coming soon. Follow along on Instagram.">
  <meta name="theme-color" content="#ffffff">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Fiona Callanan">
  <meta property="og:description" content="Yoga and handstand teacher, author and speaker. New website coming soon.">
  <meta property="og:image" content="https://sandcastleco.github.io/fiona-callanan/images/fiona-callanan-handstand-1600.jpg">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="2400">
  <meta property="og:image:alt" content="Fiona Callanan in a headstand in front of a colourful mural">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="images/fiona-callanan-handstand-1600.jpg" imagesrcset="images/fiona-callanan-handstand-1000.jpg 1000w, images/fiona-callanan-handstand-1600.jpg 1600w, images/fiona-callanan-handstand-2400.jpg 2400w" imagesizes="(min-aspect-ratio: 1/1) 80vh, 150vw">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0f2f33;
      --accent: #146b6b;
      --paper: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    :root { --frame: clamp(10px, 2.5vw, 20px); --cap: 111cqh; --pos: 51.5%; }
    .page {
      position: relative;
      height: 100vh;
      height: 100svh;
      padding: var(--frame);
    }
    .stage {
      position: relative;
      height: 100%;
      overflow: hidden;
      container-type: size;
    }
    /* Photo is 2:3; subject spans ~21-77% of width, ~22-82% of height.
       Cover the frame, capped so the subject is never cropped. --pos works like object-position. */
    .stage img {
      position: absolute;
      left: 50%;
      top: var(--pos);
      width: min(max(100cqw, 66.625cqh), var(--cap), 178cqw);
      height: auto;
      transform: translate(-50%, calc(var(--pos) * -1));
      display: block;
      user-select: none;
    }
    .name {
      position: absolute;
      z-index: 1;
      left: 0; right: 0;
      top: calc(var(--frame) + max(min(4svh, 2.5rem), env(safe-area-inset-top)));
      margin: 0;
      padding: 0 1rem;
      text-align: center;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(2rem, min(10.5vw, 7svh), 2.875rem);
      line-height: 1;
      letter-spacing: -0.01em;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 28px rgba(0,0,0,.35);
    }
    .footer {
      position: absolute;
      z-index: 1;
      left: 0; right: 0;
      bottom: calc(var(--frame) + max(min(4svh, 2.5rem), env(safe-area-inset-bottom)));
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: min(.75rem, 1.6svh);
      text-align: center;
      font-size: clamp(.8rem, min(2.4vw, 2.6svh), 1.05rem);
    }
    .soon {
      margin: 0;
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: lowercase;
      color: var(--ink);
      background: rgba(255,255,255,.88);
      padding: .3em .8em;
      border-radius: 999px;
    }
    .ig {
      display: inline-flex;
      align-items: center;
      gap: .55em;
      padding: .8em 1.3em;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(15,47,51,.25);
      transition: background .2s, transform .2s;
    }
    .ig:hover { background: var(--ink); transform: translateY(-1px); }
    .ig:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .ig svg { width: 1.2em; height: 1.2em; }

    /* Landscape: full-bleed, no frame. Show more of the photo (white side borders on wide screens)
       and bias the crop down so the text sits over the mural above her feet and the mat below her hands. */
    @media (min-aspect-ratio: 1/1) {
      :root { --frame: 0px; --cap: 80cqh; --pos: 85%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="name">Fiona Callanan</h1>
    <div class="stage">
    <img src="images/fiona-callanan-handstand-1600.jpg" width="1600" height="2400"
         srcset="images/fiona-callanan-handstand-1000.jpg 1000w, images/fiona-callanan-handstand-1600.jpg 1600w, images/fiona-callanan-handstand-2400.jpg 2400w"
         sizes="(min-aspect-ratio: 1/1) 80vh, 150vw"
         alt="Fiona Callanan in a forearm headstand on a yoga mat, legs folded and prosthetic leg raised, in front of a colourful mural"
         fetchpriority="high">
    </div>
    <div class="footer">
      <p class="soon">(site coming soon!)</p>
      <a class="ig" href="https://www.instagram.com/bionic_rocket_woman/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Follow the journey on Instagram
      </a>
    </div>
  </main>
</body>
</html>
